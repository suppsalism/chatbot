name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · test · build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm run test -- --coverage

      - name: Build
        run: npm run build

      # dist/ is gitignored, so these can only run after the build step.
      - name: Verify exports map and published paths
        run: npm run check:exports

      - name: Verify bundle size budget
        run: npm run check:size

      - name: Verify the tarball contains what it should
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const [{ files }] = require('./pack.json');
            const names = files.map((f) => f.path);
            const required = [
              'dist/chatbot.cjs',
              'dist/chatbot.module.js',
              'dist/chatbot.modern.js',
              'dist/chatbot.umd.js',
              'dist/index.d.ts',
            ];
            const missing = required.filter((f) => !names.includes(f));
            if (missing.length) {
              console.error('Missing from tarball:', missing);
              process.exit(1);
            }
            if (names.some((f) => f.startsWith('src/'))) {
              console.error('src/ must not be published');
              process.exit(1);
            }
            console.log('Tarball OK —', names.length, 'files');
          "
