name: Publish

# Publishing is driven by a version tag, which `npm version` creates:
#   npm version patch|minor|major && git push --follow-tags
#
# This file MUST stay at .github/workflows/publish.yml. npm's trusted publisher
# is bound to this exact repository + workflow filename, and it is the only
# workflow npm will accept an OIDC token from. Renaming or moving it breaks
# publishing until the trusted publisher is reconfigured on npmjs.com to match.
#
# There is no npm token anywhere in here, deliberately. Authentication is OIDC:
# GitHub mints a short-lived identity token for this workflow, npm verifies it
# against the trusted publisher config, and provenance is attached automatically.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # required — this is what mints the OIDC token

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Node 22 bundles npm 10, which predates trusted publishing entirely and
      # fails with an unhelpful auth error rather than saying so. Trusted
      # publishing needs npm >= 11.5.1.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      # Never publish something that does not pass its own gates.
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run check:exports
      - run: npm run check:size

      - name: Fail if the tag does not match package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      # No `env:` block and no --provenance flag: the token is OIDC, and
      # provenance is generated automatically under trusted publishing.
      # `access` and `provenance` are already set in package.json publishConfig.
      - run: npm publish
